<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Explorer DEMO | Umur 1–2</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(145deg,#fff8e8,#eafaff);color:#173e56;min-height:100vh}.app{max-width:980px;margin:auto;padding:18px}.panel{background:#fff;border:4px solid #ccebf3;border-radius:28px;padding:20px;box-shadow:0 12px 28px #24506b22}header{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:clamp(1.4rem,5vw,2.2rem);font-weight:1000;color:#f06f6f}.lang button,.back,.again{border:0;border-radius:14px;padding:10px 14px;font-weight:900;background:#193f57;color:#fff;cursor:pointer}.hero{text-align:center;margin:14px 0}.hero h1{margin:8px;font-size:clamp(1.8rem,6vw,3rem)}.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:15px}.topic{border:3px solid #d7eef4;border-radius:22px;padding:20px;background:linear-gradient(145deg,#fff,#eefbff);text-align:center;cursor:pointer;box-shadow:0 7px 0 #c6e6ee;min-height:150px}.topic .icon{font-size:3.2rem}.topic b{display:block;margin-top:8px;font-size:1.05rem}.hud{display:flex;justify-content:space-between;font-weight:900;gap:8px}.progress{height:14px;background:#e7f0f3;border-radius:20px;overflow:hidden;margin:12px 0}.bar{height:100%;background:linear-gradient(90deg,#63d5b2,#ffde72,#ff927b)}.prompt{text-align:center;font-size:1.2rem;font-weight:900;margin:14px}.visual{min-height:250px;border:3px solid #d7eef4;border-radius:24px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(3rem,11vw,6rem);padding:24px;background:linear-gradient(145deg,#fff,#effbff)}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}.ans{min-height:76px;border:0;border-radius:20px;background:#ffe083;color:#173e56;font-size:clamp(1.3rem,5vw,2.2rem);font-weight:1000;cursor:pointer;box-shadow:0 7px 0 #e0bc52}.ans:nth-child(even){background:#aee7db;box-shadow:0 7px 0 #76cabb}.ans.correct{background:#8be09f}.ans.wrong{background:#ff9b96}.feedback{text-align:center;min-height:38px;font-size:1.25rem;font-weight:1000;padding:8px}.hidden{display:none}.result{text-align:center}.result .stars{font-size:4rem}.clock{position:relative;width:220px;height:220px;border:8px solid #31596c;border-radius:50%;background:#fff}.clock .num{position:absolute;font-size:18px;font-weight:1000;transform:translate(-50%,-50%)}.hand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:8px}.hour{width:8px;height:58px;background:#ef6f6c}.minute{width:5px;height:82px;background:#377fa5}.dot{position:absolute;width:16px;height:16px;background:#173e56;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}.dotted{font-size:1.6em;color:transparent;-webkit-text-stroke:4px #6ba9c0;text-shadow:3px 0 transparent;letter-spacing:5px}.position{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:4.5rem}.smalllabel{font-size:1rem;font-weight:900;background:#fff3b2;padding:7px 12px;border-radius:12px}@media(max-width:600px){.answers{grid-template-columns:1fr}.visual{min-height:210px}.clock{transform:scale(.85)}}:root{--navy:#153f5a;--pink:#ff7d8f;--yellow:#ffd96a;--mint:#7dd8bd;--sky:#8ddaf0;--purple:#bca8ff}body{position:relative;overflow-x:hidden;background:radial-gradient(circle at 8% 5%,#fff1a8 0 5%,transparent 18%),radial-gradient(circle at 94% 12%,#c9f4ff 0 7%,transparent 20%),radial-gradient(circle at 8% 92%,#d9cfff 0 6%,transparent 20%),linear-gradient(145deg,#fff9e9,#effbff 48%,#fff0f6)}.app{margin-top:20px;margin-bottom:28px}.panel{position:relative;overflow:hidden;background:linear-gradient(155deg,#fffffffa,#fffcf5fa);border:5px solid #fff;outline:3px solid #ccebf3;box-shadow:0 18px 45px #23577128,0 8px 0 #b9e1eb;border-radius:34px}.panel:before{content:'✦';position:absolute;right:24px;top:72px;color:#ffd45f;font-size:34px;animation:twinkle 2.2s ease-in-out infinite}header{padding:5px 8px 16px;border-bottom:3px dashed #d9edf3}.brand{font-size:clamp(1.65rem,5vw,2.45rem);background:linear-gradient(90deg,#ff7186,#f1aa31,#55bda1,#5fa9de,#a284e8);-webkit-background-clip:text;color:transparent}.lang button,.back,.again{border:3px solid #fff;box-shadow:0 6px 0 #0e2f44,0 9px 16px #173e5622}.hero{padding:18px 12px 10px}.hero h1{text-shadow:0 4px 0 #dff4fa}.hero p{font-weight:800;color:#57798a}.topics{gap:19px;padding:6px}.topic{position:relative;overflow:hidden;border:4px solid #fff;outline:3px solid #d7eef4;border-radius:27px;padding:22px;background:linear-gradient(155deg,#fff,#f0fbff);box-shadow:0 9px 0 #c1e3ec,0 14px 24px #1c59751b;transition:.16s}.topic:nth-child(4n+1){outline-color:#ffd7df;background:linear-gradient(155deg,#fff,#fff1f4)}.topic:nth-child(4n+2){outline-color:#d3f1e6;background:linear-gradient(155deg,#fff,#edfff8)}.topic:nth-child(4n+3){outline-color:#ffe8a9;background:linear-gradient(155deg,#fff,#fff9df)}.topic:nth-child(4n){outline-color:#ddd5ff;background:linear-gradient(155deg,#fff,#f5f1ff)}.topic:hover{transform:translateY(-5px);box-shadow:0 12px 0 #b8dce7,0 20px 30px #1c597526}.topic .icon{filter:drop-shadow(0 7px 3px #173e5620);animation:float 3s ease-in-out infinite}.hud{margin-top:14px;background:#f1fbff;border:3px solid #d0edf5;border-radius:17px;padding:11px 15px;box-shadow:0 5px 0 #c5e5ee}.progress{height:18px;border:3px solid #fff;box-shadow:0 4px 0 #c6dde4}.bar{background:linear-gradient(90deg,#55d0ae,#ffe16f,#ff8e7b,#b399ff);background-size:200% 100%;animation:flow 3s linear infinite}.prompt{display:table;margin:16px auto;padding:10px 18px;border-radius:999px;background:#fff5be;border:3px solid #ffe078;box-shadow:0 5px 0 #eac85e}.visual{position:relative;border:5px solid #fff;outline:3px solid #ccebf3;border-radius:30px;background:radial-gradient(circle at 50% 15%,#fff 0 12%,transparent 45%),linear-gradient(145deg,#effbff,#fff8e9);box-shadow:inset 0 0 0 8px #ffffffa8,0 12px 25px #1a56751d}.visual:after{content:'✨';position:absolute;right:18px;top:14px;font-size:25px;animation:twinkle 2s infinite}.ans{border:4px solid #fff;border-radius:23px;box-shadow:0 8px 0 #d6b84e,0 13px 20px #173e5618;transition:.14s}.ans:nth-child(even){box-shadow:0 8px 0 #6bbdab,0 13px 20px #173e5618}.ans:hover{transform:translateY(-4px) scale(1.012)}.result{padding:32px 15px;background:linear-gradient(145deg,#fff,#fff9df);border:4px solid #ffe49a;border-radius:28px;box-shadow:0 10px 0 #e9d27f}@keyframes float{50%{transform:translateY(-6px) rotate(2deg)}}@keyframes twinkle{50%{transform:scale(1.25) rotate(12deg);opacity:.55}}@keyframes flow{to{background-position:200% 0}}@media(max-width:600px){.app{padding:10px}.panel{border-radius:25px;padding:13px}.topics{grid-template-columns:repeat(2,1fr);gap:12px}.topic{min-height:135px;padding:15px 8px}.topic .icon{font-size:2.7rem}.visual{border-radius:23px}}
</style></head><body><div class="app panel"><header><div class="brand">🌈 PlayMinda</div><div class="lang"><button onclick="setLang('bm')">BM</button> <button onclick="setLang('en')">EN</button></div></header><main><section id="home"><div class="hero"><div style="font-size:2.1rem;letter-spacing:8px">🌟 🌈 ✏️ 🧩 🎈</div><h1 id="title"></h1><p id="sub"></p><div style="display:inline-block;background:linear-gradient(90deg,#ffe27b,#ffabc1);padding:8px 16px;border-radius:999px;border:3px solid #fff;box-shadow:0 5px 0 #e7bd58;font-weight:1000">FREE DEMO • 5 QUESTIONS</div></div><div id="topics" class="topics"></div></section><section id="game" class="hidden"><button class="back" onclick="goHome()">←</button><div class="hud"><span id="qnum"></span><span id="score"></span></div><div class="progress"><div id="bar" class="bar"></div></div><div id="prompt" class="prompt"></div><div id="visual" class="visual"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div></section><section id="result" class="hidden result"><h2 id="resultTitle"></h2><div id="stars" class="stars"></div><h3 id="final"></h3><p id="high"></p><button id="again" class="again" onclick="start(topic)"></button> <button id="homeBtn" class="again" onclick="goHome()"></button></section></main></div><script>const TOTAL=5,GAME="demo_little_v1",STR={"title": {"bm": "Little Explorer DEMO | Umur 1–2", "en": "Little Explorer DEMO | Ages 1–2"}, "sub": {"bm": "Demo percuma: 3 topik visual, 5 soalan setiap sesi.", "en": "Free demo: 3 visual topics, 5 questions per session."}},UI={"question": {"bm": "Soalan", "en": "Question"}, "score": {"bm": "Skor", "en": "Score"}, "correct": {"bm": "Betul! Hebat!", "en": "Correct! Great job!"}, "try": {"bm": "Cuba lagi!", "en": "Good try!"}, "done": {"bm": "Tahniah!", "en": "Well Done!"}, "high": {"bm": "Skor Tertinggi", "en": "High Score"}, "again": {"bm": "Main Lagi", "en": "Play Again"}, "home": {"bm": "Pilih Topik", "en": "Choose Topic"}},TOPICS=[{"id": "picture", "icon": "🧸", "name": {"bm": "Padan Gambar", "en": "Match Pictures"}}, {"id": "shape", "icon": "🔷", "name": {"bm": "Padan Bentuk", "en": "Match Shapes"}}, {"id": "color", "icon": "🎨", "name": {"bm": "Warna Asas", "en": "Basic Colours"}}, {"id": "size", "icon": "🐘", "name": {"bm": "Besar & Kecil", "en": "Big & Small"}}, {"id": "same", "icon": "👀", "name": {"bm": "Sama & Berbeza", "en": "Same & Different"}}, {"id": "quantity", "icon": "🍎", "name": {"bm": "Satu & Dua", "en": "One & Two"}}].filter(t=>["picture","color","quantity"].includes(t.id));let lang='bm',topic='',qs=[],idx=0,score=0,locked=false,mem={};const $=x=>document.querySelector(x);const sh=a=>[...a].sort(()=>Math.random()-.5);function safeGet(k){try{return localStorage.getItem(k)}catch(e){return mem[k]||null}}function safeSet(k,v){try{localStorage.setItem(k,String(v))}catch(e){mem[k]=String(v)}}function txt(x){return typeof x==='object'?x[lang]:x}function opts(ans,pool){let x=[...new Set(pool.map(String).filter(v=>v!==String(ans)))];return sh([String(ans),...sh(x).slice(0,3)])}function sig(q){return [txt(q.p),txt(q.v),String(txt(q.a))].join('|')}function uniqueSession(bank){let seen=new Set(),u=[];for(const q of sh(bank)){let k=sig(q);if(!seen.has(k)){seen.add(k);u.push(q)}}if(u.length<TOTAL)throw new Error('Insufficient unique questions');return u.slice(0,TOTAL)}const SESSION_FRAMES={"bm": ["{p}", "Lihat baik-baik. {p}", "Cabaran kali ini: {p}", "Sekarang cuba ini. {p}", "Perhatikan gambar dahulu. {p}", "Jom fikir. {p}", "Giliran kamu. {p}", "Cuba jawab soalan ini. {p}", "Gunakan mata yang teliti. {p}", "Mari selesaikan ini. {p}", "Fikir sekejap sebelum memilih. {p}", "Tunjukkan jawapan kamu. {p}", "Sedia untuk cabaran seterusnya? {p}", "Gunakan apa yang kamu sudah belajar. {p}", "Akhir sekali, fokus dan jawab. {p}"], "en": ["{p}", "Look carefully. {p}", "Here is your next challenge. {p}", "Now try this one. {p}", "Look at the picture first. {p}", "Let us think. {p}", "Your turn. {p}", "Try this question. {p}", "Use your careful eyes. {p}", "Let us solve this one. {p}", "Think before you choose. {p}", "Show your answer. {p}", "Ready for the next challenge? {p}", "Use what you have learned. {p}", "Finally, focus and answer. {p}"]};function diversifySession(arr){return arr.map((q,i)=>{let bm=typeof q.p==='object'?q.p.bm:q.p,en=typeof q.p==='object'?q.p.en:q.p;q.p={bm:SESSION_FRAMES.bm[i].replace('{p}',bm),en:SESSION_FRAMES.en[i].replace('{p}',en)};q.frame=i;return q})}const DEMO_FRAMES={"bm": ["{p}", "Lihat baik-baik. {p}", "Sekarang cuba ini. {p}", "Giliran kamu. {p}", "Fokus dan jawab. {p}"], "en": ["{p}", "Look carefully. {p}", "Now try this one. {p}", "Your turn. {p}", "Focus and answer. {p}"]};function demoDiversify(a){return a.map((q,i)=>{let bm=typeof q.p==='object'?q.p.bm:q.p,en=typeof q.p==='object'?q.p.en:q.p;q.p={bm:DEMO_FRAMES.bm[i].replace('{p}',bm),en:DEMO_FRAMES.en[i].replace('{p}',en)};q.frame=i;return q})}function show(id){document.querySelectorAll('main>section').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden')}function setLang(l){lang=l;renderHome();if(topic&&idx<qs.length){qs=diversifySession(uniqueSession(build(topic)));idx=0;score=0;renderQ()}}function renderHome(){$('#title').textContent=STR.title[lang];$('#sub').textContent=STR.sub[lang];$('#topics').innerHTML='';TOPICS.forEach(t=>{let b=document.createElement('button');b.className='topic';b.innerHTML=`<div class="icon">${t.icon}</div><b>${t.name[lang]}</b>`;b.onclick=()=>start(t.id);$('#topics').appendChild(b)})}function start(t){topic=t;qs=diversifySession(uniqueSession(build(t)));idx=0;score=0;show('#game');renderQ()}function renderQ(){locked=false;let q=qs[idx];$('#qnum').textContent=`${UI.question[lang]} ${idx+1}/${TOTAL}`;$('#score').textContent=`${UI.score[lang]}: ${score}`;$('#bar').style.width=`${idx/TOTAL*100}%`;$('#prompt').textContent=txt(q.p);$('#visual').innerHTML=txt(q.v);$('#feedback').textContent='';let a=$('#answers');a.innerHTML='';q.o.forEach(o=>{let b=document.createElement('button');b.className='ans';b.innerHTML=txt(typeof o==='object'?o:{bm:o,en:o});b.onclick=()=>answer(b,String(txt(typeof o==='object'?o:{bm:o,en:o})),String(txt(q.a)));a.appendChild(b)})}function answer(btn,val,ans){if(locked)return;locked=true;let ok=val===ans;if(ok){score+=10;btn.classList.add('correct');$('#feedback').textContent=UI.correct[lang]}else{btn.classList.add('wrong');$('#feedback').textContent=UI.try[lang];[...document.querySelectorAll('.ans')].find(x=>x.textContent.trim()===ans)?.classList.add('correct')}setTimeout(()=>{idx++;idx<TOTAL?renderQ():finish()},650)}function finish(){let key='pm_'+GAME+'_high',hi=Math.max(Number(safeGet(key)||0),score);safeSet(key,hi);show('#result');$('#resultTitle').textContent=UI.done[lang];$('#final').textContent=`${UI.score[lang]}: ${score}/${TOTAL*10}`;$('#high').textContent=`${UI.high[lang]}: ${hi}`;$('#stars').textContent=score>=TOTAL*8?'⭐⭐⭐':score>=TOTAL*5?'⭐⭐':'⭐';$('#again').textContent=UI.again[lang];$('#homeBtn').textContent=UI.home[lang]}function goHome(){topic='';show('#home');renderHome()}const OBJ=['🧸','⚽','🚗','🐱','🐶','🐰','🐟','🐥','🦋','🍎','🍌','🍓','🌸','⭐','🌙','☀️','🎈','🪁','🚲','🍪','🥕','🐢','🐞','🌻'];const SHAPES=['●','■','▲','★','♥'];const COLORS=[{v:'🔴',hex:'#ef5350'},{v:'🔵',hex:'#42a5f5'},{v:'🟡',hex:'#fdd835'},{v:'🟢',hex:'#66bb6a'},{v:'🟠',hex:'#ffa726'},{v:'🟣',hex:'#ab47bc'}];function iconSize(x,big){return `<span style="display:inline-block;font-size:${big?'1.35em':'.72em'}">${x}</span>`}function build(t){let b=[];for(let i=0;i<300;i++){let a=OBJ[i%OBJ.length],c=OBJ[(i*7+5)%OBJ.length];if(c===a)c=OBJ[(i+1)%OBJ.length];if(t==='picture'){b.push({p:{bm:'Pilih gambar yang sama.',en:'Choose the matching picture.'},v:a,a:a,o:opts(a,OBJ)})}else if(t==='shape'){let x=SHAPES[i%SHAPES.length],col=COLORS[Math.floor(i/SHAPES.length)%COLORS.length].hex;b.push({p:{bm:'Pilih bentuk yang sama.',en:'Choose the matching shape.'},v:`<span style="color:${col}">${x}</span>`,a:x,o:opts(x,SHAPES)})}else if(t==='color'){let x=COLORS[i%COLORS.length],shape=SHAPES[Math.floor(i/COLORS.length)%SHAPES.length],answer=`<span style="display:inline-block;width:70px;height:70px;border-radius:18px;background:${x.hex};border:5px solid white;box-shadow:0 5px 0 #aac"></span>`,pool=COLORS.map(z=>`<span style="display:inline-block;width:70px;height:70px;border-radius:18px;background:${z.hex};border:5px solid white;box-shadow:0 5px 0 #aac"></span>`);b.push({p:{bm:'Pilih warna yang sama.',en:'Choose the matching colour.'},v:`<span style="color:${x.hex}">${shape}</span>`,a:answer,o:opts(answer,pool)})}else if(t==='size'){let wantBig=i%2===0,other=OBJ[(i+9)%OBJ.length];b.push({p:wantBig?{bm:'Pilih gambar yang besar.',en:'Choose the big picture.'}:{bm:'Pilih gambar yang kecil.',en:'Choose the small picture.'},v:`${iconSize(a,true)} ${iconSize(a,false)}`,a:iconSize(a,wantBig),o:[iconSize(a,true),iconSize(a,false),iconSize(other,true),iconSize(other,false)]})}else if(t==='same'){let z=i%2===0;b.push({p:{bm:'Adakah gambar ini sama?',en:'Are these pictures the same?'},v:`${a} ${z?a:c}`,a:z?'✅':'❌',o:['✅','❌']})}else if(t==='quantity'){let n=i%2+1;b.push({p:{bm:'Pilih jumlah gambar yang sama.',en:'Choose the matching number of pictures.'},v:a.repeat(n),a:a.repeat(n),o:[a,a.repeat(2),c,c.repeat(2)]})}}return b}renderHome();</script></body></html>
